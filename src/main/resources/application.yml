server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:sqlite:./data/platform.sqlite}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  h2:
    console:
      enabled: false
platform:
  admin-password: ${ADMIN_PASSWORD:}
  developer-password: ${DEVELOPER_PASSWORD:}
  reviewer-password: ${REVIEWER_PASSWORD:}
  vault-key: ${VAULT_KEY:}
  seed: ${SEED_DEMO:true}
  friday-url: ${FRIDAY_URL:http://localhost:18080}
  integration-hosts: ${INTEGRATION_HOSTS:api.github.com}
  integration-private-hosts: ${INTEGRATION_PRIVATE_HOSTS:}
  windows-auth-hosts: ${WINDOWS_AUTH_HOSTS:}
  windows-curl: ${WINDOWS_CURL:curl.exe}
logging:
  level:
    com.apiintel.diagnostics: ${APIINTEL_LOG_LEVEL:INFO}
